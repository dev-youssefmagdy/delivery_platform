# Flutter CI: format, analyze, test for both apps and platform_core; debug APKs. NEVER RUN YET.
# iOS: see docs/DEPLOYMENT.md (macOS runner job is documented there, not enabled: needs signing secrets).
name: flutter
on:
  push: { branches: [main] }
  pull_request:
concurrency:
  group: flutter-${{ github.ref }}
  cancel-in-progress: true
permissions: { contents: read }

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        project: [packages/platform_core, customer_app, driver_app]
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.1', channel: stable, cache: true }
      - run: flutter pub get
      - run: dart format --output=none --set-exit-if-changed .
      - run: flutter analyze
      - run: flutter test

  apk:
    needs: check
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        app: [customer_app, driver_app]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.47.1', channel: stable, cache: true }
      - run: flutter pub get
      - name: "Debug APK (no Firebase files in CI, so push is unavailable in this build)"
        run: flutter build apk --debug --dart-define=FLAVOR=dev --dart-define=API_BASE_URL=https://staging.example.invalid/api/v1
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.app }}-debug-apk
          path: ${{ matrix.app }}/build/app/outputs/flutter-apk/app-debug.apk
