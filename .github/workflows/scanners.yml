# Translation / ARB parity, route authorization inventory, secrets scan. NEVER RUN YET.
name: scanners
on:
  push: { branches: [main] }
  pull_request:
permissions: { contents: read }

jobs:
  parity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.3', coverage: none }
      - run: php scripts/check-translations.php
      - run: php scripts/check-arb-parity.php

  route-inventory:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: bcmath, intl, mbstring, pdo_mysql, redis, gd, sodium, zip, pcntl
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - name: Every route has authentication and authorization (exit 1 otherwise)
        run: php artisan route:list --json | php ../scripts/route-inventory.php > /tmp/route-inventory.md

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
